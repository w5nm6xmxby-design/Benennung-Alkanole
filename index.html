<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Lern-App Chemie EF: Benennung der Alkanole mit Baukasten">
<title>Alkanol-Baukasten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Lerneinheit Schritt für Schritt. Oben Titel und Schrittleiste, darunter links der Auftrag, rechts die
   Werkbank mit Baukasten und Formeln, unten eine feste Leiste mit Ergebnisblatt-Haken und Weiter.
   Formelfarben wie im Buch: Hauptkette blau, OH-Gruppe rot, Methylgruppen orange, Ethylgruppen violett. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#16231D; --muted:#55645C; --line:#C9D4CE;
  --accent:#4B7A26; --accent-ink:#FFFFFF; --teal:#1D8C85; --teal-tint:#DDF0EE;
  --chain:#2B5EA8; --chain-tint:#E1EAF7; --oh:#C33E28; --methyl:#A65700; --ethyl:#7443AE;
  --ok:#2B7A44; --ok-tint:#E0F1E5; --bad:#B3412A; --bad-tint:#F8E3DD; --hint:#7D5B00; --hint-tint:#FFF3D1;
  --slot:#879990; --glow:#FFD966; --scrim:rgba(16,24,20,.5); --label-band:#1D8C85; --label-ink:#FFFFFF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-formel:"Atkinson Hyperlegible",Arial,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1416; --surface:#162024; --surface-2:#1C282C; --ink:#E3ECE7; --muted:#9BAEA5; --line:#2C3B38;
    --accent:#8CC15A; --accent-ink:#0E1416; --teal:#4CC2B8; --teal-tint:#123634;
    --chain:#86AEF2; --chain-tint:#1A2A44; --oh:#F27D65; --methyl:#F0A64F; --ethyl:#BC9AF2;
    --ok:#6FC78C; --ok-tint:#15301F; --bad:#F08C73; --bad-tint:#3A1D17; --hint:#F2C94C; --hint-tint:#30270E;
    --slot:#6D807A; --glow:#6B5A1C; --scrim:rgba(0,0,0,.62); --label-band:#1F6F6A; --label-ink:#F1F7F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1416; --surface:#162024; --surface-2:#1C282C; --ink:#E3ECE7; --muted:#9BAEA5; --line:#2C3B38;
  --accent:#8CC15A; --accent-ink:#0E1416; --teal:#4CC2B8; --teal-tint:#123634;
  --chain:#86AEF2; --chain-tint:#1A2A44; --oh:#F27D65; --methyl:#F0A64F; --ethyl:#BC9AF2;
  --ok:#6FC78C; --ok-tint:#15301F; --bad:#F08C73; --bad-tint:#3A1D17; --hint:#F2C94C; --hint-tint:#30270E;
  --slot:#6D807A; --glow:#6B5A1C; --scrim:rgba(0,0,0,.62); --label-band:#1F6F6A; --label-ink:#F1F7F5;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body.noscroll{overflow:hidden}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
sub{font-size:.7em;line-height:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;padding-block:10px}
.brand{min-width:0;flex:1 1 230px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand .t{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.15}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;min-width:44px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.chip.done{background:var(--ok-tint);color:var(--ok);border-color:transparent}
.chip[aria-current="step"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:default}

/* Bühne */
main{max-width:1280px;margin:0 auto;padding-block:16px 128px}
.stage{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.panel,.bench{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0}
.panel{padding:16px 18px;gap:12px}
.bench{padding:14px;gap:12px}
.stephead{display:flex;flex-direction:column;gap:2px}
.stephead h2{font-family:var(--f-display);font-weight:800;font-size:27px;line-height:1.15}
.meta{font-size:13.5px;color:var(--muted)}
.info{background:var(--teal-tint);border-left:5px solid var(--teal);border-radius:8px;padding:10px 12px;font-size:15.5px}
.info b{color:var(--ink)}
ol.auftrag{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;counter-reset:a}
ol.auftrag li{counter-increment:a;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
ol.auftrag li::before{content:counter(a);width:26px;height:26px;border-radius:50%;background:var(--hint-tint);color:var(--hint);font-weight:800;display:grid;place-items:center;font-size:14px}
.feld{display:inline-block;font-weight:700;color:var(--teal);white-space:nowrap}
.tips{display:flex;gap:8px;flex-wrap:wrap}
.tipbox{background:var(--hint-tint);border-left:5px solid var(--hint);border-radius:8px;padding:10px 12px;font-size:15.5px}
.tipbox b{color:var(--hint)}
.sep{height:1px;background:var(--line);margin:2px 0}
.hd{font-family:var(--f-display);font-weight:700;font-size:17px}
.small{font-size:14px;color:var(--muted)}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15.5px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:40px;padding:6px 12px;font-size:14.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Leiste unten */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px 14px;padding-block:10px;flex-wrap:wrap}
.trans{flex:1 1 240px;display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;font-size:15.5px;cursor:pointer;min-width:0}
.trans input{flex:none;width:26px;height:26px;margin:0;accent-color:var(--accent)}
.trans .why{display:block;font-weight:400;font-size:13px;color:var(--muted)}

/* Formeln */
.fbox{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fbox svg.builder{margin:0 auto}
svg.formel{display:block;max-width:100%;height:auto;overflow:visible}
svg.formel.builder{max-width:none}
.formel .at{font-family:var(--f-formel);font-size:24px;fill:var(--ink)}
.formel .sub{font-size:16px}
.formel .k-chain{fill:var(--chain)}
.formel .k-methyl{fill:var(--methyl)}
.formel .k-ethyl{fill:var(--ethyl)}
.formel .k-oh{fill:var(--oh)}
.formel line{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.formel .loc{font-family:var(--f-body);font-size:15px;font-weight:700;fill:var(--chain)}
.formel .rlab{font-family:var(--f-formel);font-size:24px;fill:var(--ink)}
.formel .slot circle{fill:var(--surface);stroke:var(--slot);stroke-width:2;stroke-dasharray:5 4}
.formel .slot text{fill:var(--slot);font-family:var(--f-body);font-size:24px;font-weight:700}
.formel .hit{fill:transparent;cursor:pointer}
.formel .glow{fill:var(--glow)}
.formel .ring{fill:none;stroke:var(--oh);stroke-width:2.5;stroke-dasharray:6 4}
.name{font-family:var(--f-formel);font-size:26px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.name.sm{font-size:19px}
.n-chain{color:var(--chain)}
.n-oh{color:var(--oh)}
.n-methyl{color:var(--methyl)}
.n-ethyl{color:var(--ethyl)}
.mf{font-family:var(--f-formel);font-size:17px;color:var(--muted)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Werkbank-Bausteine */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tool{min-height:44px;min-width:58px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-formel);font-weight:700;font-size:17px;cursor:pointer}
.tool.oh{color:var(--oh)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .val{min-width:96px;text-align:center;font-weight:700;font-size:15px}
.stepper .btn{min-width:48px;font-size:20px;padding:4px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{min-height:44px;padding:6px 16px;border:0;background:var(--surface);font-weight:700;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.compose{display:flex;flex-direction:column;gap:8px}
.display{min-height:58px;border:2px solid var(--line);border-radius:10px;padding:10px 14px;font-family:var(--f-formel);font-size:25px;font-weight:700;background:var(--surface-2);overflow-wrap:anywhere;display:flex;align-items:center}
.display.empty{color:var(--muted);font-weight:400;font-size:16.5px;font-family:var(--f-body)}
.tilerow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tile{min-width:46px;min-height:46px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16.5px;cursor:pointer;-webkit-user-select:none;user-select:none}
.tile.sym{font-size:22px;line-height:1;min-width:50px}
.tile.k-chain{color:var(--chain)}
.tile.k-oh{color:var(--oh)}
.tile.k-sub{color:var(--ink)}
.tile.ctrl{background:var(--surface-2);font-size:14.5px}
.tile:disabled{opacity:.4}
.fb{border-radius:9px;padding:10px 12px;font-size:15.5px}
.fb.ok{background:var(--ok-tint);border-left:5px solid var(--ok)}
.fb.bad{background:var(--bad-tint);border-left:5px solid var(--bad)}
.fb.note{background:var(--surface-2);border-left:5px solid var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:42px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.tab .st{width:11px;height:11px;border-radius:50%;background:var(--line)}
.tab .st.ok{background:var(--ok)}
.tab .st.sol{background:var(--hint)}
.target{display:flex;flex-direction:column;gap:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.ex{border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ex .nr{font-size:13px;font-weight:700;color:var(--muted)}
.pair{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px 12px;align-items:center}
.pair .lab{font-weight:700;color:var(--muted);font-size:14px}
@media (max-width:520px){.pair{grid-template-columns:minmax(0,1fr)}}
.tried{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tried b{display:inline-grid;place-items:center;width:34px;height:30px;border-radius:7px;border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.tried b.on{border:1px solid var(--chain);background:var(--chain-tint);color:var(--chain)}
.quiz{display:flex;flex-direction:column;gap:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-formel);font-weight:700;font-size:17px}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.cls{display:flex;gap:6px;flex-wrap:wrap}
.cls .opt{font-family:var(--f-body);font-size:15px}
.rform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rform>div{border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center;min-width:0}
.rform .hd{font-size:15px}
.profi-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:620px){.profi-pick{grid-template-columns:minmax(0,1fr)}}
.pcard{border:2px dashed var(--muted);border-radius:12px;padding:12px 14px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:44px}
.pcard[aria-pressed="true"]{border-style:solid;border-color:var(--accent)}
.pcard .hd{font-size:18px}
.found{display:flex;flex-direction:column;gap:4px}
.found li{font-family:var(--f-formel);font-weight:700}

/* Start */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:start}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1.08;letter-spacing:-.01em}
.hero .subt{font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--muted);margin-top:6px}
.etikett{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:360px;justify-self:center;width:100%;box-shadow:0 10px 24px rgba(0,0,0,.08)}
.etikett .band{background:var(--label-band);color:var(--label-ink);padding:12px 16px;font-family:var(--f-display);font-weight:800;font-size:19px}
.etikett .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.etikett .w{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.etikett .stoff{font-family:var(--f-formel);font-weight:700;font-size:24px;color:var(--oh)}
.etikett .klein{font-size:13px;color:var(--muted)}
.ablauf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.ablauf{grid-template-columns:minmax(0,1fr)}}
.ablauf table{width:100%;border-collapse:collapse;font-size:15px}
.ablauf td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.ablauf td:last-child{text-align:right;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ablauf .hd{margin-bottom:4px}
.startcol{display:flex;flex-direction:column;gap:14px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Dialog */
.modal{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:14px;padding:18px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal-box h3{font-family:var(--f-display);font-weight:800;font-size:21px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<header class="top"><div class="top-in wrap" id="top"></div></header>
<main class="wrap" id="main"></main>
<footer class="bottom" id="bottom" hidden><div class="bottom-in wrap" id="bottomIn"></div></footer>
<div class="modal" id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalT" id="modalBox"></div></div>
<script>/* Benennungslogik für den Alkanol-Baukasten (EF 01-09).
   Ein Molekül wird als Bauplan beschrieben: {n: Länge der gezeichneten Kette, s: {"2u": "CH3", "1d": "OH", ...}}.
   Plätze: Index des C-Atoms (0 = links) plus u (oben), d (unten) oder e (waagerecht am rechten Ende, nur für OH).
   Gruppen: OH, CH3, C2H5, CH2OH (CH2OH nur für gezeichnete Aufgaben, nicht im Baukasten).
   Regeln wie Fokus Chemie EF S. 47: Hauptkette = längste Kette mit dem C-Atom der OH-Gruppe, OH-Gruppe mit
   kleinstmöglicher Nummer, dann Seitenketten mit kleinstmöglichen Nummern, alphabetisch, Zahlwörter di, tri, tetra. */
var CHEM = (function () {
  var STAMM = ['', 'meth', 'eth', 'prop', 'but', 'pent', 'hex', 'hept', 'oct', 'non', 'dec', 'undec', 'dodec'];
  var MULT = ['', '', 'di', 'tri', 'tetra', 'penta', 'hexa'];
  var MULT2 = ['', '', 'bis', 'tris', 'tetrakis'];
  var STEMS = {};
  for (var q = 1; q < STAMM.length; q++) STEMS[STAMM[q] + 'an'] = q;

  function num(a, b) { return a - b; }
  function cmpStr(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function lex(a, b) {
    var n = Math.min(a.length, b.length);
    for (var i = 0; i < n; i++) if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
    return a.length - b.length;
  }
  function same(a, b) { return lex(a, b) === 0; }
  function cap(s) { return s.replace(/[a-zäöü]/, function (c) { return c.toUpperCase(); }); }

  /* Bauplan in einen Graphen übersetzen. Atome 0 bis n-1 sind die gezeichnete Kette. */
  function graph(spec) {
    var atoms = [], slots = {};
    function add(oh) { atoms.push({ nb: [], oh: oh ? 1 : 0 }); return atoms.length - 1; }
    function bond(a, b) { atoms[a].nb.push(b); atoms[b].nb.push(a); }
    for (var i = 0; i < spec.n; i++) { add(false); if (i > 0) bond(i - 1, i); }
    var keys = Object.keys(spec.s || {}).sort();
    keys.forEach(function (k) {
      var i = parseInt(k, 10), t = spec.s[k];
      if (!(i >= 0 && i < spec.n)) return;
      if (t === 'OH') { atoms[i].oh += 1; slots[k] = { type: t, at: i, atoms: [] }; }
      else if (t === 'CH3') { var a = add(false); bond(i, a); slots[k] = { type: t, at: i, atoms: [a] }; }
      else if (t === 'C2H5') { var a1 = add(false), a2 = add(false); bond(i, a1); bond(a1, a2); slots[k] = { type: t, at: i, atoms: [a1, a2] }; }
      else if (t === 'CH2OH') { var c = add(true); bond(i, c); slots[k] = { type: t, at: i, atoms: [c] }; }
    });
    return { atoms: atoms, n: spec.n, slots: slots };
  }

  function treePath(atoms, u, v) {
    var prev = {}; prev[u] = -1; var qu = [u];
    while (qu.length) {
      var x = qu.shift(); if (x === v) break;
      atoms[x].nb.forEach(function (y) { if (!(y in prev)) { prev[y] = x; qu.push(y); } });
    }
    var p = []; for (var z = v; z !== -1; z = prev[z]) p.push(z);
    return p.reverse();
  }

var FS = 24, SFS = 16, DX = 80, DY = 64, CAP = 17, GAP = 5, SC = 0.85;
function measure() {
  try {
    var ctx = document.createElement('canvas').getContext('2d');
    ctx.font = FS + 'px ' + FONT;
    M.C = ctx.measureText('C').width; M.H = ctx.measureText('H').width; M.O = ctx.measureText('O').width;
    ctx.font = SFS + 'px ' + FONT; M.d = ctx.measureText('3').width;
  } catch (e) {}
}
function cLab(x, y, k, h) { return { x: x, y: y, left: x - M.C / 2, w: M.C + (h > 0 ? M.H : 0) + (h > 1 ? M.d : 0), t: 'C', h: h, k: k }; }
function oLab(x, y) { return { x: x, y: y, left: x - M.O / 2, w: M.O + M.H, t: 'OH', k: 'oh' }; }
function bondLine(a, b) {
  if (Math.abs(a.y - b.y) < 1) {
    var l = a.x < b.x ? a : b, r = a.x < b.x ? b : a;
    return [l.left + l.w + GAP, l.y, r.left - GAP, r.y];
  }
  var u = a.y < b.y ? a : b, d = a.y < b.y ? b : a;
  return [u.x, u.y + CAP / 2 + GAP + 3, d.x, d.y - CAP / 2 - GAP];
}
function txt(l, extra) {
  var s = '<text class="at' + (l.k ? ' k-' + l.k : '') + (extra || '') + '" x="' + f(l.left) + '" y="' + f(l.y + CAP / 2) + '">';
  if (l.t === 'OH') s += 'OH';
  else { s += 'C'; if (l.h > 0) s += 'H'; if (l.h > 1) s += '<tspan class="sub" dy="5">' + l.h + '</tspan>'; }
  return s + '</text>';
}
/* o: color, numbers, slots ('u' oder 'ud'), hl (Atome), ring (Atom), fixW (Kettenlänge für feste Breite), label */
function drawFormel(spec, o) {
  o = o || {};
  var r = CHEM.analyse(spec), g = r ? r.graph : CHEM.graph(spec), atoms = g.atoms, n = spec.n;
  var pos = {}, L = {}, labs = [], bonds = [];
  for (var i = 0; i < n; i++) pos[i] = { x: i * DX, y: 0 };
  Object.keys(g.slots).forEach(function (k) {
    var sl = g.slots[k], side = k.slice(-1), sg = side === 'u' ? -1 : 1;
    if (side === 'e') return;
    sl.atoms.forEach(function (a, j) { pos[a] = { x: sl.at * DX, y: sg * DY * (j + 1) }; });
  });
  atoms.forEach(function (at, id) {
    var k = (o.color && r) ? (r.kind[id] || '') : '';
    L[id] = cLab(pos[id].x, pos[id].y, k, 4 - at.nb.length - at.oh);
    labs.push(L[id]);
  });
  atoms.forEach(function (at, id) { at.nb.forEach(function (j) { if (j > id) bonds.push([L[id], L[j]]); }); });
  Object.keys(g.slots).forEach(function (k) {
    var sl = g.slots[k], side = k.slice(-1), c = L[sl.at], ol;
    if (sl.type === 'OH') {
      if (side === 'e') ol = oLab(c.left + c.w + 44 + M.O / 2, 0);
      else ol = oLab(c.x, (side === 'u' ? -1 : 1) * DY);
      labs.push(ol); bonds.push([c, ol]);
    } else if (sl.type === 'CH2OH') {
      var cc = L[sl.atoms[0]];
      ol = oLab(cc.x, (side === 'u' ? -2 : 2) * DY);
      labs.push(ol); bonds.push([cc, ol]);
    }
  });
  var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  function ext(a, b, c, d) { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); }
  labs.forEach(function (l) { ext(l.left - (o.numbers ? 20 : 4), l.y - 24, l.left + l.w + 6, l.y + 20); });
  var slotVis = '', slotHit = '';
  if (o.slots) {
    for (var si = 0; si < n; si++) o.slots.split('').forEach(function (side) {
      var key = si + side, x = si * DX, y = (side === 'u' ? -1 : 1) * DY;
      var yTop = side === 'u' ? -2 * DY - 26 : DY - 30, hh = DY + 56;
      ext(x - 26, y - 26, x + 26, y + 26);
      if (!spec.s[key]) slotVis += '<circle cx="' + x + '" cy="' + y + '" r="21"/><text x="' + x + '" y="' + (y + 8) + '" text-anchor="middle">+</text>';
      slotHit += '<rect class="hit" data-a="slot" data-slot="' + key + '" x="' + (x - 40) + '" y="' + yTop + '" width="80" height="' + hh + '"><title>Platz ' + (side === 'u' ? 'über' : 'unter') + ' dem ' + (si + 1) + '. C-Atom</title></rect>';
    });
  }
  if (o.fixY) { y0 = Math.min(y0, -2 * DY - 26); y1 = Math.max(y1, 2 * DY + 26); }
  if (o.fixW) {
    var want = (o.fixW - 1) * DX + 110, have = x1 - x0;
    if (have < want) { x0 -= (want - have) / 2; x1 += (want - have) / 2; }
  }
  var vb = [f(x0 - 6), f(y0 - 6), f(x1 - x0 + 12), f(y1 - y0 + 12)], sc = o.scale || SC;
  var s = '<svg class="formel' + (o.cls ? ' ' + o.cls : '') + '" viewBox="' + vb.join(' ') + '" width="' + f(vb[2] * sc) + '" height="' + f(vb[3] * sc) + '"' + (o.b ? ' data-b="' + o.b + '"' : '') +
    ' role="img" aria-label="' + esc(o.label || ('Halbstrukturformel' + (r && o.sayName ? ' von ' + r.name : ''))) + '">';
  (o.hl || []).forEach(function (a) { var l = L[a]; if (l) s += '<rect class="glow" x="' + f(l.left - 7) + '" y="' + f(l.y - 18) + '" width="' + f(l.w + 14) + '" height="36" rx="12"/>'; });
  if (o.ring != null && L[o.ring]) { var rl = L[o.ring]; s += '<rect class="ring" x="' + f(rl.left - 8) + '" y="' + f(rl.y - 19) + '" width="' + f(rl.w + 16) + '" height="38" rx="13"/>'; }
  if (slotVis) s += '<g class="slot" aria-hidden="true">' + slotVis + '</g>';
  bonds.forEach(function (b) { var p = bondLine(b[0], b[1]); s += '<line x1="' + f(p[0]) + '" y1="' + f(p[1]) + '" x2="' + f(p[2]) + '" y2="' + f(p[3]) + '"/>'; });
  labs.forEach(function (l) { s += txt(l); });
  if (o.numbers && r) r.chain.forEach(function (a) {
    var l = L[a]; s += '<text class="loc" x="' + f(l.left - 2) + '" y="' + f(l.y - CAP / 2 - 3) + '" text-anchor="end">' + r.loc[a] + '</text>';
  });
  return s + slotHit + '</svg>';
}
/* Allgemeine Formeln R-C-OH für B3 */
function rFormel(top, bottom) {
  var s = '<svg class="formel" viewBox="-70 -78 190 156" width="152" height="125" style="margin:0 auto" role="img" aria-label="allgemeine Formel">';
  var c = cLab(0, 0, '', 0), oh = oLab(c.left + c.w + 44 + M.O / 2, 0);
  s += '<line x1="' + f(-58 + 22) + '" y1="0" x2="' + f(c.left - GAP) + '" y2="0"/>';
  s += '<line x1="' + f(c.left + c.w + GAP) + '" y1="0" x2="' + f(oh.left - GAP) + '" y2="0"/>';
  s += '<line x1="0" y1="' + f(-CAP / 2 - GAP - 3) + '" x2="0" y2="' + f(-DY + CAP / 2 + GAP) + '"/>';
  s += '<line x1="0" y1="' + f(CAP / 2 + GAP + 3) + '" x2="0" y2="' + f(DY - CAP / 2 - GAP) + '"/>';
  s += '<text class="rlab" x="-58" y="' + f(CAP / 2) + '">R</text>' + txt(c) + txt(oh);
  s += '<text class="rlab" x="' + f(-M.C / 2) + '" y="' + f(-DY + CAP / 2) + '">' + top + '</text>';
  s += '<text class="rlab" x="' + f(-M.C / 2) + '" y="' + f(DY + CAP / 2) + '">' + bottom + '</text>';
  return s + '</svg>';
}

/* ---------- Bausteine für Namen ---------- */
var TILES = [
  { cap: 'Nummern und Zeichen', t: ['1', '2', '3', '4', '5', '6', '7', '8', ',', '-'] },
  { cap: 'Seitenketten und Zahlwörter', t: ['methyl', 'ethyl', 'di', 'tri', 'tetra'] },
  { cap: 'Hauptkette', t: ['methan', 'ethan', 'propan', 'butan', 'pentan', 'hexan', 'heptan', 'octan'] },
  { cap: 'Endung', t: ['ol'] }
];
var TLAB = { ',': ',', '-': '-', methyl: 'Methyl', ethyl: 'Ethyl', di: 'di', tri: 'tri', tetra: 'tetra', ol: 'ol' };
var TARIA = { ',': 'Komma', '-': 'Bindestrich', ol: 'Endung ol' };
function tileLabel(t) { return TLAB[t] || (t.length > 2 ? CHEM.cap(t) : t); }
function tileClass(t) {
  if (t === ',' || t === '-') return ' sym';
  if (t === 'ol') return ' k-oh';
  if (/an$/.test(t)) return ' k-chain';
  return '';
}
function composer(cid, tk, lock) {
  var show = tk.length ? '<span>' + esc(CHEM.cap(tk.join(''))) + '</span>' : 'Tippe die Bausteine in der richtigen Reihenfolge an.';
  var h = '<div class="compose"><div class="display' + (tk.length ? '' : ' empty') + '" aria-live="polite">' + show + '</div>';
  TILES.forEach(function (grp) {
    h += '<div class="tilerow" role="group" aria-label="' + grp.cap + '">';
    grp.t.forEach(function (t) {
      h += '<button type="button" class="tile' + tileClass(t) + '" data-a="tile" data-c="' + cid + '" data-v="' + esc(t) + '"' +
        (TARIA[t] ? ' aria-label="' + TARIA[t] + '"' : '') + (lock ? ' disabled' : '') + '>' + esc(tileLabel(t)) + '</button>';
    });
    if (grp.cap === 'Endung') {
      h += '<button type="button" class="tile ctrl" data-a="del" data-c="' + cid + '"' + (lock || !tk.length ? ' disabled' : '') + '>Letzten löschen</button>' +
        '<button type="button" class="tile ctrl" data-a="clear" data-c="' + cid + '"' + (lock || !tk.length ? ' disabled' : '') + '>Alles löschen</button>';
    }
    h += '</div>';
  });
  return h + '</div>';
}

/* ---------- Baukasten ---------- */
var TOOLS = [['OH', 'OH'], ['CH3', 'CH<sub>3</sub>'], ['C2H5', 'C<sub>2</sub>H<sub>5</sub>'], ['X', 'Radierer']];
function builder(b, spec, opts) {
  opts = opts || {};
  var h = '<div class="toolbar">';
  if (!opts.onlyOH) {
    h += '<div class="tools" role="group" aria-label="Werkzeuge">';
    TOOLS.forEach(function (t) {
      h += '<button type="button" class="tool' + (t[0] === 'OH' ? ' oh' : '') + '" data-a="tool" data-t="' + t[0] + '" aria-pressed="' + (S.tool === t[0]) + '">' + t[1] + '</button>';
    });
    h += '</div>';
    h += '<div class="stepper"><button type="button" class="btn" data-a="len" data-b="' + b + '" data-d="-1" aria-label="Kette kürzer"' + (spec.n <= 1 ? ' disabled' : '') + '>&minus;</button>' +
      '<span class="val">Kette: ' + spec.n + ' C</span><button type="button" class="btn" data-a="len" data-b="' + b + '" data-d="1" aria-label="Kette länger"' + (spec.n >= 8 ? ' disabled' : '') + '>+</button></div>';
  }
  h += '</div>';
  h += '<div class="fbox">' + drawFormel(spec, { slots: opts.onlyOH ? 'u' : 'ud', b: b, cls: 'builder', fixW: 8, fixY: true, color: !!opts.color, numbers: !!opts.numbers, label: 'Baukasten' }) + '</div>';
  return h;
}
function place(spec, key, tool, maxOH) {
  var s = spec.s, cur = s[key], i = parseInt(key, 10), other = i + (key.slice(-1) === 'u' ? 'd' : 'u');
  S.note = null;
  if (tool === 'X') { delete s[key]; return; }
  if (cur === tool) { delete s[key]; return; }
  if (tool === 'OH') {
    if (s[other] === 'OH') { S.note = 'Ein C-Atom trägt höchstens eine OH-Gruppe.'; return; }
    var ohs = Object.keys(s).filter(function (k) { return s[k] === 'OH' && k !== key; });
    if (ohs.length >= maxOH) {
      if (maxOH === 1) { delete s[ohs[0]]; S.note = 'Die OH-Gruppe sitzt jetzt am neuen Platz. In dieser Aufgabe gibt es nur eine OH-Gruppe.'; }
      else { S.note = 'Mehr als ' + maxOH + ' OH-Gruppen sind hier nicht vorgesehen.'; return; }
    }
  }
  s[key] = tool;
}

/* ---------- Gemeinsame Teile ---------- */
function head(eb, title, meta) {
  return '<div class="stephead"><div class="eyebrow">' + eb + '</div><h2>' + title + '</h2>' + (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div>';
}
function auftrag(items) { return '<ol class="auftrag">' + items.map(function (x) { return '<li><span>' + x + '</span></li>'; }).join('') + '</ol>'; }
function feld(name) { return '<span class="feld">Feld ' + name + '</span>'; }
function tips(key, t1, t2, onOpen2) {
  var n = S.tips[key] || 0;
  var h = '<div class="tips"><button type="button" class="btn small" data-a="tip" data-k="' + key + '" data-n="1" aria-expanded="' + (n >= 1) + '">Tipp 1</button>' +
    '<button type="button" class="btn small" data-a="tip" data-k="' + key + '" data-n="2" aria-expanded="' + (n >= 2) + '"' + (n < 1 ? ' disabled' : '') + '>Tipp 2</button></div>';
  if (n >= 1) h += '<div class="tipbox fade"><b>Tipp 1.</b> ' + t1 + '</div>';
  if (n >= 2) h += '<div class="tipbox fade"><b>Tipp 2.</b> ' + t2 + '</div>';
  return h;
}
function legend() {
  return '<div class="legend"><span><i style="background:var(--chain)"></i>Hauptkette</span><span><i style="background:var(--oh)"></i>OH-Gruppe</span>' +
    '<span><i style="background:var(--methyl)"></i>Methylgruppe</span><span><i style="background:var(--ethyl)"></i>Ethylgruppe</span></div>';
}
function fbBox(fb) { return fb ? '<div class="fb ' + fb.cls + ' fade" role="status">' + fb.msg + '</div>' : ''; }

    '<span class="val">' + n + ' C-Atom' + (n > 1 ? 'e' : '') + '</span><button type="button" class="btn" data-a="a1n" data-d="1" aria-label="ein C-Atom mehr"' + (n >= 8 ? ' disabled' : '') + '>+</button></div></div>' +

function nameTask(group, list) {

/* ---------- Seite aufbauen ---------- */
function idx(s) { return STEPS.indexOf(s); }
function renderTop() {
  var h = '<div class="brand"><div class="eyebrow">Chemie EF</div><div class="t">Benennung der Alkanole</div></div>';
  if (S.step !== 'start') {
    h += '<nav class="chips" aria-label="Schritte">' + STEPS.filter(function (s) { return CHIP[s]; }).map(function (s) {
      var i = idx(s), cur = S.step === s, done = i < S.max && !cur && (!FELD[s] || S.trans[s]);
      return '<button type="button" class="chip' + (done ? ' done' : '') + '" data-a="go" data-s="' + s + '"' + (cur ? ' aria-current="step"' : '') + (i > S.max ? ' disabled' : '') + '>' + CHIP[s] + '</button>';
    }).join('') + '</nav>';
  }
  document.getElementById('top').innerHTML = h;
}
function renderBottom() {
  var bt = document.getElementById('bottom'), s = S.step;
  if (s === 'start' || s === 'end') { bt.hidden = true; return; }
  bt.hidden = false;
  var h = '<button type="button" class="btn" data-a="prev">Zurück</button>';
  if (FELD[s]) {
    h += '<label class="trans"><input type="checkbox" id="trans-' + s + '" data-a="trans"' + (S.trans[s] ? ' checked' : '') + '><span>' + FELD[s] +
      (S.trans[s] ? '' : '<span class="why">Erst dann geht es weiter.</span>') + '</span></label>';
  } else h += '<span class="trans"></span>';
  var ok = !FELD[s] || S.trans[s];
  h += '<button type="button" class="btn primary" data-a="next"' + (ok ? '' : ' disabled') + '>' + (s === 'P' ? 'Zum Abschluss' : s === 'H2' ? 'Zu den Profi-Karten' : 'Weiter') + '</button>';
  document.getElementById('bottomIn').innerHTML = h;
}
function render() {
  renderTop();
  var m = document.getElementById('main'), v = VIEW[S.step]();
  if (typeof v === 'string') m.innerHTML = '<div class="fade">' + v + '</div>';
  else m.innerHTML = '<div class="stage"><section class="panel" aria-label="Auftrag">' + v.panel + '</section><section class="bench" aria-label="Werkbank">' + v.bench + '</section></div>';
  renderBottom();
  save();
}
function go(s) {
  if (idx(s) < 0) return;
  S.step = s; S.max = Math.max(S.max, idx(s)); S.note = null;
  render();
  try { window.scrollTo(0, 0); } catch (e) {}
}

function findTask(c) {
  var p = c.split(':'), group = p[0], id = p[1];
  var list = group === 'b1' ? B1 : group === 'b2' ? B2 : PB;
  var d = list.filter(function (x) { return x.id === id; })[0];
  return { group: group, d: d, t: task(group, id) };
}
function tokensOf(c) { return c === 'pa' ? S.pa.tk : findTask(c).t.tk; }

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-a'), D = function (k) { return el.getAttribute('data-' + k); };
  if (a === 'trans') return;
  switch (a) {
    case 'start': S.started = true; go(S.max > 1 ? STEPS[S.max] : 'A1'); return;
    case 'go': go(D('s')); return;
    case 'next': if (FELD[S.step] && !S.trans[S.step]) return; go(STEPS[idx(S.step) + 1]); return;
    case 'prev': go(STEPS[Math.max(0, idx(S.step) - 1)]); return;
    case 'tip': var k = D('k'), n = +D('n'); S.tips[k] = Math.max(S.tips[k] || 0, n); break;
    case 'ttip': var ft = findTask(D('c')); ft.t.tips = Math.max(ft.t.tips || 0, +D('n')); break;
    case 'b3tip': S.b3tips = Math.max(S.b3tips || 0, +D('n')); break;
    case 'patip': S.pa.tips = Math.max(S.pa.tips || 0, +D('n')); break;
    case 'a1n': S.a1n = Math.max(1, Math.min(8, S.a1n + (+D('d')))); break;
    case 'a2c': S.a2c = +D('n'); break;
    case 'q1': S.q1 = D('v'); break;
    case 'q2': S.q2 = D('v'); break;
    case 'b3': S.b3[+D('i')] = D('v'); break;
    case 'profi': S.profi = D('v'); S.note = null; break;
    case 'tool': S.tool = D('t'); S.note = null; break;
    case 'tab': S[D('g')].i = +D('i'); S.note = null; break;
    case 'len': {
      var b = D('b'), spec = b === 'pa' ? S.pa.spec : findTask(currentTaskKey(b)).t.spec;
      spec.n = Math.max(1, Math.min(8, spec.n + (+D('d'))));
      Object.keys(spec.s).forEach(function (kk) { if (parseInt(kk, 10) >= spec.n) delete spec.s[kk]; });
      S.note = null; resetFb(b);
      break;
    }
    case 'slot': {
      var svg = el.closest('svg'), bb = svg && svg.getAttribute('data-b'), key = D('slot');
      if (bb === 'a2') {
        S.a2[S.a2c] = key;
        if (S.a2c === 5) S.a2tried[parseInt(key, 10)] = true;
      } else if (bb) {
        var sp = bb === 'pa' ? S.pa.spec : findTask(currentTaskKey(bb)).t.spec;
        if (bb !== 'pa' && findTask(currentTaskKey(bb)).t.ok) return;
        place(sp, key, S.tool, bb === 'pb' ? 3 : 1);
        S.noteB = bb; resetFb(bb);
      }
      break;
    }
    case 'tile': {
      var tk = tokensOf(D('c')); if (tk.length < 30) tk.push(D('v'));
      if (D('c') !== 'pa') { var x = findTask(D('c')); if (x.t.fb && x.t.fb.cls === 'bad') x.t.fb = null; }
      else if (S.pa.fb && S.pa.fb.cls !== 'ok') S.pa.fb = null;
      break;
    }
    case 'del': tokensOf(D('c')).pop(); break;
    case 'clear': { var t2 = tokensOf(D('c')); t2.length = 0; break; }
    case 'check': {
      S.note = null;
      var x1 = findTask(D('c')), r = CHEM.analyse(SP[x1.d.sp]), dg = CHEM.diagnose(x1.t.tk, r);
      if (dg.ok) { x1.t.ok = true; x1.t.fb = { cls: 'ok', msg: 'Richtig. ' + (dg.note ? esc(dg.note) + ' ' : '') + 'Die Farben und Nummern zeigen Hauptkette und Nummerierung.' }; }
      else { if (dg.code !== 'leer') x1.t.tries++; x1.t.fb = { cls: 'bad', msg: esc(dg.msg) }; }
      break;
    }
    case 'bcheck': {
      var x2 = findTask(D('c')), rb = CHEM.analyse(x2.t.spec), rt = CHEM.analyse(SP[x2.d.sp]), vg = CHEM.vergleiche(rb, rt);
      if (vg.ok) { x2.t.ok = true; x2.t.fb = { cls: 'ok', msg: 'Richtig. Die Farben und Nummern zeigen Hauptkette und Nummerierung.' }; }
      else { x2.t.tries++; x2.t.fb = { cls: 'bad', msg: esc(vg.msg) }; }
      S.note = null;
      break;
    }
    case 'sol': {
      var x3 = findTask(D('c'));
      x3.t.sol = true;
      var rn = CHEM.analyse(SP[x3.d.sp]);
      x3.t.fb = x3.d.art === 'bau' || x3.group === 'b2'
        ? { cls: 'note', msg: 'Vergleiche die Lösung mit deinem Molekül.' }
        : { cls: 'note', msg: 'Lösung: ' + esc(rn.name) + '. Vergleiche mit deinem Versuch und trage den Namen ein.' };
      break;
    }
    case 'pacheck': {
      S.note = null;
      var A = S.pa, rr = CHEM.analyse(A.spec);
      if (!rr) A.fb = { cls: 'bad', msg: 'Stelle zuerst ein Molekül dar.' };
      else if (rr.nC !== 6 || rr.ohCount !== 1) A.fb = { cls: 'bad', msg: 'Ein Hexanol hat 6 C-Atome und eine OH-Gruppe. Dein Molekül hat ' + rr.nC + ' C-Atom' + (rr.nC > 1 ? 'e' : '') + ' und ' + rr.ohCount + ' OH-Gruppe' + (rr.ohCount === 1 ? '' : 'n') + '.' };
      else {
        var dd = CHEM.diagnose(A.tk, rr);
        if (!dd.ok) A.fb = { cls: 'bad', msg: esc(dd.msg) };
        else if (A.found.indexOf(rr.name) >= 0) A.fb = { cls: 'note', msg: esc(rr.name) + ' hast du schon gefunden. Verändere die Stellung der OH-Gruppe oder der Seitenketten.' };
        else { A.found.push(rr.name); A.tk = []; A.fb = { cls: 'ok', msg: 'Richtig. ' + esc(rr.name) + ' ist ein Isomer des Hexanols.' + (A.found.length >= 4 ? ' Du hast vier Isomere gefunden. Es gibt noch mehr.' : '') }; }
      }
      break;
    }
    case 'end-ask': openModal('ende'); return;
    case 'modal-close': closeModal(); return;
    case 'reset':
      S = fresh(); try { localStorage.removeItem(KEY); } catch (e) {}
      closeModal(); render(); try { window.scrollTo(0, 0); } catch (e) {}
      return;
    default: return;
  }
  render();
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el && el.getAttribute && el.getAttribute('data-a') === 'trans') { S.trans[S.step] = el.checked; render(); }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !document.getElementById('modal').hidden) closeModal(); });
function currentTaskKey(group) {
  var list = group === 'b2' ? B2 : group === 'pb' ? PB : B1, i = Math.min(S[group].i, list.length - 1);
  return group + ':' + list[i].id;
}
function resetFb(b) {
  if (b === 'pa') { S.pa.fb = null; return; }
  if (b === 'b2' || b === 'pb') { var x = findTask(currentTaskKey(b)); if (x.t.fb && x.t.fb.cls !== 'note') x.t.fb = null; }
}

/* ---------- Start ---------- */
measure();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measure(); render(); });
if (S.started && !neu) openModal('sitzung');
})();
</script>
